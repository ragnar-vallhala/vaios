# vaios test suites, for extern/vtest (see extern/vtest/README.md).
#
#   extern/vtest/build/vtest          interactive TUI
#   extern/vtest/build/vtest --run    everything, batch
#   extern/vtest/build/vtest --list   the catalog
#
# The layers below mirror tools/run_all_tests.sh: host unit suites first (fast,
# no hardware), then the gates, then the emulated and on-target runs. Anything
# needing arm-none-eabi-gcc / renode / a board is a `check` around the script
# that already owns it, so there is one definition of each run, not two.

# The host-native unit suites: seven binaries registered with ctest
# (scheduler, IPC, memory, bus, periph_bus, devfs, syscall dispatch, ...).
[host]
adapter = ctest
dir     = build_tests
configure = cmake -S tests -B build_tests
open    = 1

# cppcheck + gcc -fanalyzer + the portability tripwire, exactly as CI runs them.
[static-analysis]
adapter = check
cmd     = bash tools/run_static_analysis.sh

# CodeQL security-and-quality, both CI targets (host + arm-firmware), exactly as
# .github/workflows/codeql.yml runs them. Skips cleanly when the CLI is absent,
# since the bundle is a 1.4 GB optional install.
#
# Slow -- minutes per target, because a traced build cannot be incremental -- and
# it runs both anyway: `host` alone never compiles portable/armv7e-m/*.c, so a
# host-only pass would be a false all-clear for syscall.c's dispatch and its
# pointer validation.
#
# It reports findings, it does not gate on them; the gate is CI's upload to the
# Security tab, where dismissals live.
[codeql]
adapter = check
cmd     = bash tools/run_codeql.sh all

# Line/branch/function coverage of the host-compiled sources, merged across
# every test binary; fails under the floor CI also enforces.
[coverage]
adapter = check
cmd     = bash tools/coverage.sh --min-lines 70

# Cross builds: FPU on/off, NAVHAL on/off (arm-none-eabi-gcc).
[build-matrix]
adapter = check
cmd     = bash tools/test_build_matrix.sh

# QEMU: context-switch smoke x16 + soft-float clock bring-up.
[qemu]
adapter = check
cmd     = bash tools/test_qemu_smoke.sh

# The host PORT (real scheduler + SVC path): unprivileged syscall pointers.
[host-port]
adapter = check
cmd     = bash tools/run_host.sh HOST_USER_RO

# On-target unit suite under Renode (the same cases as [host], cross-built).
[sitl]
adapter = check
cmd     = bash tools/run_all_tests.sh sitl

# On-target regressions, one Renode run each.
[sitl-isolation]
adapter = check
cmd     = bash tools/renode_isolation.sh

[sitl-lifecycle]
adapter = check
cmd     = bash tools/renode_lifecycle.sh

[sitl-fdipc]
adapter = check
cmd     = bash tools/renode_fdipc.sh

[sitl-periph-bus]
adapter = check
cmd     = bash tools/renode_bus.sh

[sitl-pbus-user]
adapter = check
cmd     = bash tools/renode_pbus_user.sh

[sitl-bus-ipc]
adapter = check
cmd     = bash tools/renode_bus_ipc.sh

[sitl-bus-user]
adapter = check
cmd     = bash tools/renode_bus_user.sh

# The release gate: a flight-shaped app with every application task unprivileged.
[sitl-flight-user]
adapter = check
cmd     = bash tools/renode_flight_user.sh

# Hardware in the loop: flashes the board and reads its UART. With several probes
# attached it refuses to guess which one — name the board's USB port:
#   USB_LOC=3-2 tools/vtest.sh --run
# (tools/flash.sh --list prints the attached probes' locations.) Selection is by
# USB location, not by serial: the ST-Links on this bench are clones sharing one
# serial descriptor, so a serial cannot tell them apart. The OpenOCD target
# script follows the build's family on its own.
[pitl]
adapter = check
cmd     = bash tools/run_hw_tests.sh

[loc]
adapter = check
cmd     = vtest-loc kernel include portable tests tools examples
