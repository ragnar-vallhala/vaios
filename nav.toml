# Nav Configuration File
[project]
name = "vaios"
version = "0.2.0"
# vaios builds a static archive (libvaios) that nav firmware projects depend on.
# Its CMake target is named `vaios`, matching this name so nav links it directly.
type = "library"

# Board used when building vaios standalone. When a firmware project depends on
# vaios, it is rebuilt for that project's board (must be NavHAL-supported).
#
# This must agree with navhal.config, which is what the CMake build actually
# reads: NavHAL's Kconfig resolves the board there, and vaios takes the linker
# script, the core and the console from that answer. `arch` is the ISA, which is
# also the port directory name (portable/armv7e-m) — the core within it,
# cortex-m4 or cortex-m7, comes from the board.
[target]
arch = "armv7e-m"
vendor = "stm32"
board = "navixsmf401re"

[build]
backend = "cmake"

# vaios owns the Cortex-M CPU vectors (SysTick/PendSV/SVCall/HardFault). A
# firmware project depending on vaios must build NavHAL with -DSUBMODULE so
# NavHAL cedes those handlers instead of emitting its own (link collision).
[library]
navhal_submodule = true
