name: ci

on:
  push:
    branches: [dev, stable]
  pull_request:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Host tests stub navhal.h / utils/v_fs.h / utils/util.h, so the
        # NavHAL submodule is not required to build them.

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              gcc cmake make python3 python3-pip
          # kconfiglib drives the Kconfig config generation the host build now
          # runs at configure time (tools/kconfig.py).
          python3 -m pip install --break-system-packages kconfiglib

      - name: Run host test suite
        run: bash tools/run_tests.sh
