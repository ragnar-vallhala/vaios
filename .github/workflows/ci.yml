name: ci

on:
  push:
    branches: [dev, stable]
  pull_request:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Host tests stub navhal.h / utils/v_fs.h / utils/util.h, so the
        # NavHAL submodule is not required to build them.

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              gcc cmake make python3 python3-pip cppcheck
          # kconfiglib drives the Kconfig config generation the host build now
          # runs at configure time (tools/kconfig.py). cppcheck backs the static
          # analysis gate run_tests.sh invokes (tools/run_static_analysis.sh);
          # gcc -fanalyzer ships with gcc above.
          python3 -m pip install --break-system-packages kconfiglib

      # Fails fast, before the build, if any hardware-specific code (inline asm,
      # arch macros, vendor includes, memory-mapped I/O) leaked into kernel/ or
      # include/. Pure grep, no deps. Also runs inside run_tests.sh's static
      # analysis gate; this dedicated step makes it a first-class check.
      - name: Portability tripwire
        run: bash tools/check_portability.sh

      - name: Run host test suite
        run: bash tools/run_tests.sh

  sitl:
    name: On-target (Renode) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SITL builds the real firmware (NAVHAL=ON), so the NavHAL submodule
          # is required — unlike the host job, which stubs it.
          submodules: recursive

      - name: Install toolchain, Kconfig, and Renode
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              gcc-arm-none-eabi libnewlib-arm-none-eabi \
              cmake make python3 python3-pip curl \
              libgtk-3-0 libgomp1
          python3 -m pip install --break-system-packages kconfiglib
          # Pinned Renode portable release (bundles its runtime); headless via
          # --disable-xwt in tools/renode.resc. Pin the version so a Renode
          # update cannot silently change CI behaviour.
          RENODE_VER=1.16.1
          curl -fsSL -o /tmp/renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VER}/renode-${RENODE_VER}.linux-portable.tar.gz"
          mkdir -p "$HOME/renode"
          tar -xzf /tmp/renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"

      - name: Renode sanity
        run: renode --version

      - name: On-target unit suite (PIL) in Renode
        run: |
          export srctree="$PWD/extern/NavHAL"
          bash tools/run_all_tests.sh sitl

      - name: Stage-5 isolation regression in Renode
        run: bash tools/renode_isolation.sh

      - name: Stage-5 task-teardown regression in Renode
        run: bash tools/renode_lifecycle.sh

      - name: Stage-5 fd-typed IPC regression in Renode
        run: bash tools/renode_fdipc.sh
